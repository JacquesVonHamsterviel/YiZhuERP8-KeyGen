<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>易助8.0注册机</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="stylesheet" href="yz_keygen_ui.css">
</head>
<body>
<div class="win" role="dialog" aria-label="易助8.0注册机">
  <div class="titlebar">
    <span class="ico"><img src="favicon.ico" alt="易" width="18" height="18"></span>
    <span class="t">易助8.0注册机</span>
    <span class="btns">
      <span class="capbtn min disabled" title="最小化（已禁用）" aria-disabled="true">&#x2500;</span>
      <span class="capbtn max" title="最大化" role="button" onclick="toggleMaximize(this)">&#x25A1;</span>
      <span class="capbtn close" title="关闭" role="button" onclick="closeWindow()">&#x2715;</span>
    </span>
  </div>

  <div class="client">
    <!-- 左：软件模块 -->
    <div class="left">
      <label class="btn modall" id="btnModule" style="margin-bottom:4px"
             title="全选/全不选所有模块">
        <input type="checkbox" id="chkAll" autocomplete="off"
               onclick="toggleAllModules(this.checked)"> 软件模块
      </label>
      <div class="listhdr" style="display:flex;align-items:center;gap:4px">
        <span style="flex:1">系统名称</span><span>人数</span>
        <input type="text" id="mcntAll" maxlength="3" value="00" autocomplete="off"
               title="批量人数：改这里，下面所有模块的人数同步跟着变（上限 99）"
               oninput="setAllModuleCounts(this.value)"
               style="width:34px;height:18px;text-align:center;font-size:11px;padding:1px;box-sizing:border-box;border:1px solid var(--shadow);">
      </div>
      <!-- 列表 + 灰色蒙版层（未勾选任何模块时显示；纯视觉，不挡点击） -->
      <div class="list-wrap" id="listWrap">
        <div class="list" id="modlist"></div>
        <div class="veil" aria-hidden="true"><span class="veil-txt">未勾选模块（默认序列号）</span></div>
      </div>
    </div>

    <!-- 右：三个分组 + 生成 -->
    <div class="right">
      <!-- 授权模式 -->
      <fieldset>
        <legend>授权模式</legend>
        <div class="row">
          <label class="radio"><input type="radio" name="authmode" id="rbDiv" checked
                 autocomplete="off" onclick="selectModuleMode()">分模块人数授权</label>
          <label class="radio"><input type="radio" name="authmode" id="rbProd"
                 autocomplete="off" onclick="enterProductMode()">产品人数授权</label>
          <label class="f">设定用户数</label>
          <input type="text" id="uc" size="4" placeholder="人数" autocomplete="off" disabled
                 title="设定用户数：≤9999 的整数">
        </div>
      </fieldset>

      <!-- 使用期限设定（展示用，不影响序列号） -->
      <fieldset>
        <legend>使用期限设定 <span style="font-weight:normal;color:#999;font-size:11px">（仅界面，不影响序列号）</span></legend>
        <div class="row">
          <label class="radio"><input type="checkbox" id="chkPeriod" autocomplete="off"
                 onclick="togglePeriod(this.checked)">设定期限</label>
          <label class="f">注册日期:</label>
          <input type="date" id="regdate" autocomplete="off" disabled>
          <label class="f">授权天数:</label>
          <input type="text" id="days" size="5" placeholder="天" autocomplete="off" disabled>
        </div>
      </fieldset>

      <!-- 授权设置 -->
      <fieldset>
        <legend>授权设置</legend>
        <div class="row">
          <label class="f" style="width:56px">授权用户:</label>
          <input type="text" id="user" size="12" autocomplete="off" autofocus>
          <label class="f" style="width:44px">客户号:</label>
          <input type="text" id="customer" size="12" autocomplete="off">
        </div>
        <div class="row">
          <label class="f" style="width:56px">安装序号:</label>
          <input type="text" id="install" size="40" style="flex:1" autocomplete="off">
        </div>
        <div class="row out">
          <label class="f" style="width:56px">产品序号:</label>
          <input type="text" id="serial" style="flex:1"
                 title="生成结果；也可在此粘贴一个序列号，点“反推验证”校验并回填">
          <button class="btn copy" onclick="copyEl('serial')">复制</button>
        </div>
        <div class="row out">
          <label class="f" style="width:56px">验证口令:</label>
          <input type="text" id="pw" size="12"
                 title="生成结果；反推验证时在此粘贴对应的验证口令">
          <button class="btn copy" onclick="copyEl('pw')">复制</button>
        </div>
      </fieldset>

      <div class="warn" id="warn"></div>
      <div class="row" style="justify-content:flex-end;gap:8px;margin:0">
        <button class="btn gen" style="font-weight:normal;margin-top:0" onclick="onReverse()"
                title="从 安装序号 + 产品序号 + 验证口令 校验合法性，合法则回填 授权用户/客户号/模块配置">反推验证</button>
        <button class="btn gen" style="margin-top:0" onclick="onGenerate()">生成序列号</button>
      </div>
    </div>
  </div>
  <div class="note">
    · 支持<b>默认</b> / <b>产品人数授权</b>（填“设定用户数”）/ <b>分模块人数授权</b>（勾模块+填人数）·
    “使用期限设定”经插桩确认<b>不影响序列号</b>（生成只读客户号/授权用户/安装序号），故此处禁用。<br>
    <b>反推验证</b>：粘贴“产品序号”+“验证口令”并填“安装序号”，校验合法性；合法则自动回填授权用户/客户号/模块配置
    （h1 由序列号自校验、h2 绑定安装序号；GBK 用浏览器原生解码，无需第三方库）。
  </div>
</div>

<script src="yz_keygen_ui.js"></script>
</body>
</html>
